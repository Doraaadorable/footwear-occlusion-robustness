<svg xmlns="http://www.w3.org/2000/svg" width="850" height="450" viewBox="0 0 850 450" role="img" aria-labelledby="title desc">
<title id="title">Observed test balanced accuracy</title>
<desc id="desc">Three blood CNN variants and the collection suffix control reach 100 percent. Results are exploratory, on 64 images from 16 related shoe pairs.</desc>
<rect width="850" height="450" fill="white"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<text x="24" y="30" font-size="21">Observed test balanced accuracy</text>
<text x="24" y="53" font-size="13">64 images / 16 pairs • exploratory • controls reveal collection confounding</text>
<text x="24" y="96" font-size="14">Majority</text>
<rect x="260" y="78" width="240.0" height="25" fill="#286493"/>
<text x="510.0" y="96" font-size="14">50.00%</text>
<text x="24" y="136" font-size="14">Handiprint transfer</text>
<rect x="260" y="118" width="345.0" height="25" fill="#286493"/>
<text x="615.0" y="136" font-size="14">71.88%</text>
<text x="24" y="176" font-size="14">HOG</text>
<rect x="260" y="158" width="442.5" height="25" fill="#286493"/>
<text x="712.5" y="176" font-size="14">92.19%</text>
<text x="24" y="216" font-size="14">RGB</text>
<rect x="260" y="198" width="480.0" height="25" fill="#286493"/>
<text x="750.0" y="216" font-size="14">100.00%</text>
<text x="24" y="256" font-size="14">Grayscale</text>
<rect x="260" y="238" width="480.0" height="25" fill="#286493"/>
<text x="750.0" y="256" font-size="14">100.00%</text>
<text x="24" y="296" font-size="14">RGB + occlusion</text>
<rect x="260" y="278" width="480.0" height="25" fill="#286493"/>
<text x="750.0" y="296" font-size="14">100.00%</text>
<text x="24" y="336" font-size="14">Collection suffix control</text>
<rect x="260" y="318" width="480.0" height="25" fill="#b46a23"/>
<text x="750.0" y="336" font-size="14">100.00%</text>
<text x="24" y="376" font-size="14">Area + brightness control</text>
<rect x="260" y="358" width="382.5" height="25" fill="#b46a23"/>
<text x="652.5" y="376" font-size="14">79.69%</text>
<text x="24" y="423" font-size="13">Perfect observed scores do not establish tread-specific learning or population accuracy.</text>
</g></svg>